services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: pdf_epub
      POSTGRES_PASSWORD: pdf_epub
      POSTGRES_DB: pdf_epub
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdf_epub"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.2-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:38421"
    working_dir: /app/backend
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://pdf_epub:pdf_epub@db:5432/pdf_epub
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ..:/app
    ports:
      - "38421:38421"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: celery -A config worker -l info
    working_dir: /app/backend
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://pdf_epub:pdf_epub@db:5432/pdf_epub
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ..:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
