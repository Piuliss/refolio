[project]
name = "pdf-epub-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "converter",
    "django>=5.1.6,<5.2",
    "djangorestframework>=3.15.2,<4",
    "django-environ>=0.12.0,<1",
    "psycopg[binary]>=3.2.4,<4",
    "celery[redis]>=5.4.0,<6",
    "redis>=5.2.1,<6",
    "gunicorn>=23.0.0,<24",
]

[tool.uv.sources]
converter = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4,<9",
    "pytest-django>=4.9.0,<5",
    "ruff>=0.9.6,<1",
    "mypy>=1.14.1,<2",
    "django-stubs>=5.1.2,<6",
    "djangorestframework-stubs>=3.15.2,<4",
]

[build-system]
requires = ["setuptools>=75.8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "apps*"]
